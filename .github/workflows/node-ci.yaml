
name: build and push to docker hub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code  # clone git code to ubuntu runner
        uses: actions/checkout@v6
      
      - name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Image
        run: docker docker build -t ${{ secrets.DOCKER_USERNAME }}/ak-node:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ak-node:latest

